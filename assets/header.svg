<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Mahmoud Khalil — Flutter Engineer and Flutter Team Lead">
  <title>Mahmoud Khalil — Flutter Engineer and Flutter Team Lead</title>

  <defs>
    <clipPath id="card"><rect x="0" y="0" width="900" height="240" rx="18" /></clipPath>

    <clipPath id="type">
      <rect x="233" y="112" width="434" height="22">
        <animate attributeName="width" values="0;434" dur="1.9s" begin="0.55s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1020" /><stop offset="50%" stop-color="#0E1B2F" /><stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0" /><stop offset="30%" stop-color="#2F81F7" />
      <stop offset="70%" stop-color="#21D4A8" /><stop offset="100%" stop-color="#21D4A8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" /><stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="52" /></filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7" /><stop offset="50%" stop-color="#7FD8FF" /><stop offset="100%" stop-color="#21D4A8" />
    </linearGradient>

    <filter id="beamglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="g" /><feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)" />

    <g opacity="0.5" filter="url(#soft)">
      <circle cx="190" cy="70" r="130" fill="#2F81F7" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,0; 70,40; -30,25; 0,0" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
      <circle cx="700" cy="180" r="150" fill="#7C5CFF" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0,0; -80,-45; 40,-20; 0,0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
      <circle cx="470" cy="230" r="120" fill="#21D4A8" opacity="0.38">
        <animateTransform attributeName="transform" type="translate" values="0,0; 50,-55; -60,-20; 0,0" dur="25s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
    </g>

    <rect x="-320" y="0" width="320" height="240" fill="url(#sweep)" opacity="0.06">
      <animate attributeName="x" values="-320;900" dur="6.5s" begin="1.4s;sweep.end+5s" id="sweep" />
    </rect>

    <g fill="#7FB2FF">
      <circle cx="118" cy="240" r="1.6" opacity="0">
        <animate attributeName="cy" values="240;-10" dur="11s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.8;1" dur="11s" repeatCount="indefinite" />
      </circle>
      <circle cx="332" cy="240" r="1.2" opacity="0">
        <animate attributeName="cy" values="240;-10" dur="14s" begin="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.15;0.8;1" dur="14s" begin="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="596" cy="240" r="1.8" opacity="0">
        <animate attributeName="cy" values="240;-10" dur="13s" begin="5.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.15;0.8;1" dur="13s" begin="5.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="792" cy="240" r="1.3" opacity="0">
        <animate attributeName="cy" values="240;-10" dur="16s" begin="8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.15;0.8;1" dur="16s" begin="8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="239" rx="18" fill="none" stroke="#1B2740" />

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="450" y="88" font-size="42" font-weight="700" letter-spacing="1.5" fill="#F0F6FC">
      MAHMOUD KHALIL
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <animateTransform attributeName="transform" type="translate" values="0,14;0,0" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
    </text>

    <line x1="330" y1="104" x2="570" y2="104" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="450;330" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <animate attributeName="x2" values="450;570" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
    </line>

    <g clip-path="url(#type)">
      <text x="450" y="128" font-size="13" font-weight="600" letter-spacing="4.2" fill="#8FA1B8">FLUTTER ENGINEER · FLUTTER TEAM LEAD</text>
    </g>

    <rect x="665" y="117" width="2" height="14" fill="#58A6FF" opacity="0">
      <animate attributeName="x" values="233;667" dur="1.9s" begin="0.55s" fill="freeze" calcMode="linear" />
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.55s" fill="freeze" />
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="0.7s" begin="0.55s" repeatCount="3" />
      <animate attributeName="opacity" values="1;0" dur="0.3s" begin="2.55s" fill="freeze" />
    </rect>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="middle" fill="#58A6FF" filter="url(#glow)">
    <text x="450" y="160">
      4 years of production Flutter
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="450" y="160" opacity="0">
      DNS filtering on NetworkExtension &amp; VpnService
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="450" y="160" opacity="0">
      Real-time telemedicine over chat, voice &amp; video
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="450" y="160" opacity="0">
      500+ builds shipped to App Store &amp; Google Play
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <rect x="567" y="150" width="7.5" height="13" fill="#58A6FF" opacity="0">
      <animate attributeName="opacity" values="0.75;0.75;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.6s" repeatCount="indefinite" />
      <animate attributeName="x" values="567;634;638;634" keyTimes="0;0.25;0.5;0.75" dur="18s" begin="2.6s" repeatCount="indefinite" calcMode="discrete" />
    </rect>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle">
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.9s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="230" y="182" width="111" height="28" rx="14" fill="#132139" stroke="#25406B" />
      <rect x="230" y="182" width="111" height="28" rx="14" fill="none" stroke="url(#beam)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="36 217.96" filter="url(#beamglow)" opacity="0.95">
        <animate attributeName="stroke-dashoffset" values="0;-253.96" dur="2.8s" begin="1.5s" repeatCount="indefinite" />
      </rect>
      <text x="285.5" y="200" fill="#C9D6E6">Flutter · 4 yrs</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="1.05s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="353" y="182" width="206" height="28" rx="14" fill="#132139" stroke="#25406B" />
      <rect x="353" y="182" width="206" height="28" rx="14" fill="none" stroke="url(#beam)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="36 407.96" filter="url(#beamglow)" opacity="0.95">
        <animate attributeName="stroke-dashoffset" values="0;-443.96" dur="5.4s" begin="2.1s" repeatCount="indefinite" />
      </rect>
      <text x="456" y="200" fill="#C9D6E6">500+ App Store &amp; Play releases</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="571" y="182" width="100" height="28" rx="14" fill="#132139" stroke="#25406B" />
      <rect x="571" y="182" width="100" height="28" rx="14" fill="none" stroke="url(#beam)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="36 195.96" filter="url(#beamglow)" opacity="0.95">
        <animate attributeName="stroke-dashoffset" values="0;-231.96" dur="2.6s" begin="2.7s" repeatCount="indefinite" />
      </rect>
      <text x="621" y="200" fill="#C9D6E6">Team Lead</text>
    </g>
  </g>
</svg>
