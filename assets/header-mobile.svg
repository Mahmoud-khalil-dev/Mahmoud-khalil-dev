<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Mahmoud Khalil — Flutter Engineer and Flutter Team Lead">
  <title>Mahmoud Khalil — Flutter Engineer and Flutter Team Lead</title>

  <defs>
    <clipPath id="cardM"><rect x="0" y="0" width="480" height="600" rx="18" /></clipPath>

    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1020">
        <animate attributeName="stop-color" values="#0A1020;#12203F;#0B2436;#161334;#0A1020" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1" />
      </stop>
      <stop offset="50%" stop-color="#0E1B2F">
        <animate attributeName="stop-color" values="#0E1B2F;#1A2C56;#123449;#231a4d;#0E1B2F" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1" />
      </stop>
      <stop offset="100%" stop-color="#080D1A">
        <animate attributeName="stop-color" values="#080D1A;#0D1428;#0A1E26;#120F2A;#080D1A" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1" />
      </stop>
    </linearGradient>

    <linearGradient id="ruleM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0" /><stop offset="30%" stop-color="#2F81F7" />
      <stop offset="70%" stop-color="#21D4A8" /><stop offset="100%" stop-color="#21D4A8" stop-opacity="0" />
    </linearGradient>

    <filter id="softM" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46" /></filter>
    <filter id="glowM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="beamglowM" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="g" /><feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="scrimM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B14" stop-opacity="0.25" />
      <stop offset="0.14" stop-color="#060B14" stop-opacity="0.68" />
      <stop offset="0.82" stop-color="#060B14" stop-opacity="0.6" />
      <stop offset="1" stop-color="#060B14" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="nameShineM" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="260" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#E4EDF8" /><stop offset="0.34" stop-color="#FFFFFF" />
      <stop offset="0.46" stop-color="#FFFFFF" /><stop offset="0.72" stop-color="#DFE9F6" /><stop offset="1" stop-color="#E4EDF8" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 200 0" dur="3.2s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="nameGlowM" x="-25%" y="-80%" width="150%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b" />
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.78  0 0 0 0 1  0 0 0 0.32 0" result="tint" />
      <feMerge><feMergeNode in="tint" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="beam1M" gradientUnits="userSpaceOnUse" x1="150" y1="316" x2="330" y2="316" spreadMethod="repeat">
      <stop offset="0" stop-color="#1E3557" /><stop offset="0.3" stop-color="#2F81F7" />
      <stop offset="0.6" stop-color="#21D4A8" /><stop offset="1" stop-color="#1E3557" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 180 0" dur="1.1s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="beam2M" gradientUnits="userSpaceOnUse" x1="90" y1="368" x2="390" y2="368" spreadMethod="repeat">
      <stop offset="0" stop-color="#1E3557" /><stop offset="0.3" stop-color="#2F81F7" />
      <stop offset="0.6" stop-color="#21D4A8" /><stop offset="1" stop-color="#1E3557" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 300 0" dur="1.4s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="beam3M" gradientUnits="userSpaceOnUse" x1="160" y1="420" x2="320" y2="420" spreadMethod="repeat">
      <stop offset="0" stop-color="#1E3557" /><stop offset="0.3" stop-color="#2F81F7" />
      <stop offset="0.6" stop-color="#21D4A8" /><stop offset="1" stop-color="#1E3557" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 160 0" dur="1s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <g clip-path="url(#cardM)">
    <rect width="480" height="600" fill="url(#bgM)" />

    <g opacity="0.5" filter="url(#softM)">
      <circle cx="120" cy="140" r="130" fill="#2F81F7" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 60,50; -30,20; 0,0" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
      <circle cx="360" cy="320" r="150" fill="#7C5CFF" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; -50,40; 30,-30; 0,0" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
      <circle cx="220" cy="500" r="120" fill="#21D4A8" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="0,0; 40,-30; -35,25; 0,0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      </circle>
    </g>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" opacity="0.5">
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0,-160; 0,620" dur="9s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.78;1" dur="9s" begin="1s" repeatCount="indefinite" />
        <text x="46" y="0" fill="#26D07C" opacity="0.2">1</text><text x="46" y="14" fill="#26D07C" opacity="0.3">0</text>
        <text x="46" y="28" fill="#26D07C" opacity="0.4">1</text><text x="46" y="42" fill="#C8FFE4" opacity="0.9">1</text>
      </g>
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0,-200; 0,620" dur="11s" begin="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.78;1" dur="11s" begin="4s" repeatCount="indefinite" />
        <text x="150" y="0" fill="#26D07C" opacity="0.2">0</text><text x="150" y="14" fill="#26D07C" opacity="0.3">1</text>
        <text x="150" y="28" fill="#26D07C" opacity="0.4">0</text><text x="150" y="42" fill="#C8FFE4" opacity="0.9">0</text>
      </g>
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0,-140; 0,620" dur="8s" begin="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.78;1" dur="8s" begin="2.5s" repeatCount="indefinite" />
        <text x="330" y="0" fill="#26D07C" opacity="0.2">1</text><text x="330" y="14" fill="#26D07C" opacity="0.3">1</text>
        <text x="330" y="28" fill="#26D07C" opacity="0.4">0</text><text x="330" y="42" fill="#C8FFE4" opacity="0.9">1</text>
      </g>
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,620" dur="12s" begin="6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.78;1" dur="12s" begin="6s" repeatCount="indefinite" />
        <text x="430" y="0" fill="#26D07C" opacity="0.2">0</text><text x="430" y="14" fill="#26D07C" opacity="0.3">0</text>
        <text x="430" y="28" fill="#26D07C" opacity="0.4">1</text><text x="430" y="42" fill="#C8FFE4" opacity="0.9">1</text>
      </g>
    </g>

    <rect width="480" height="600" fill="url(#scrimM)" />
  </g>

  <rect x="0.5" y="0.5" width="479" height="599" rx="18" fill="none" stroke="#1B2740" />

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="240" y="146" font-size="34" font-weight="700" letter-spacing="1" fill="url(#nameShineM)" filter="url(#nameGlowM)">
      MAHMOUD KHALIL
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <animateTransform attributeName="transform" type="translate" values="0,14;0,0" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
    </text>

    <line x1="240" y1="168" x2="240" y2="168" stroke="url(#ruleM)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="240;120" dur="0.9s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <animate attributeName="x2" values="240;360" dur="0.9s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
    </line>

    <g opacity="0" font-size="13" font-weight="600" letter-spacing="3" fill="#8FA1B8">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1s" fill="freeze" />
      <text x="240" y="196">FLUTTER ENGINEER</text>
      <text x="240" y="220">FLUTTER TEAM LEAD</text>
    </g>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" text-anchor="middle" fill="#58A6FF" filter="url(#glowM)">
    <text x="240" y="266">
      4 years of production Flutter
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="240" y="266" opacity="0">
      DNS filtering on NetworkExtension &amp; VpnService
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="240" y="266" opacity="0">
      Real-time telemedicine over chat, voice &amp; video
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
    <text x="240" y="266" opacity="0">
      500+ builds shipped to App Store &amp; Google Play
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="18s" begin="2.6s" repeatCount="indefinite" />
    </text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.1s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="150" y="300" width="180" height="32" rx="16" fill="#132139" stroke="url(#beam1M)" stroke-width="2" filter="url(#beamglowM)" />
      <text x="240" y="321" fill="#C9D6E6">Flutter · 4 yrs</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.25s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="90" y="352" width="300" height="32" rx="16" fill="#132139" stroke="url(#beam2M)" stroke-width="2" filter="url(#beamglowM)" />
      <text x="240" y="373" fill="#C9D6E6">500+ App Store &amp; Play releases</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.4s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.7s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <rect x="160" y="404" width="160" height="32" rx="16" fill="#132139" stroke="url(#beam3M)" stroke-width="2" filter="url(#beamglowM)" />
      <text x="240" y="425" fill="#C9D6E6">Team Lead</text>
    </g>
  </g>
</svg>
