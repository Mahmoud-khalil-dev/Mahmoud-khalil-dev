<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0" />
      <stop offset="50%" stop-color="#2F81F7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21D4A8" stop-opacity="0" />
      <stop offset="50%" stop-color="#7FD8FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#21D4A8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="strip"><rect x="0" y="0" width="900" height="6" /></clipPath>
  </defs>

  <rect x="0" y="2.5" width="900" height="1" fill="url(#base)" />

  <g clip-path="url(#strip)">
    <rect x="-220" y="2" width="220" height="2" fill="url(#pulse)" rx="1">
      <animate attributeName="x" values="-220;900" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1" />
    </rect>
  </g>
</svg>
