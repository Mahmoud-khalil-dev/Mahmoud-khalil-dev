<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="4 years in production, 4+ flagship products, 500+ live on stores, 6 codebases behind them">
  <title>4 years in production · 4+ flagship products · 500+ live on stores · 6 codebases behind them</title>

  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2F81F7" stop-opacity="0" /><stop offset="50%" stop-color="#58A6FF" /><stop offset="100%" stop-color="#2F81F7" stop-opacity="0" /></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0" /><stop offset="50%" stop-color="#A08BFF" /><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" /></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#21D4A8" stop-opacity="0" /><stop offset="50%" stop-color="#4FE7C1" /><stop offset="100%" stop-color="#21D4A8" stop-opacity="0" /></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F0B429" stop-opacity="0" /><stop offset="50%" stop-color="#FFCF5C" /><stop offset="100%" stop-color="#F0B429" stop-opacity="0" /></linearGradient>
    <filter id="lum" x="-300%" y="-900%" width="700%" height="1900%">
      <feGaussianBlur stdDeviation="2.4" result="g" /><feMerge><feMergeNode in="g" /><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="bar1"><rect x="79.5" y="77" width="66" height="6" rx="3" /></clipPath>
    <clipPath id="bar2"><rect x="304.5" y="77" width="66" height="6" rx="3" /></clipPath>
    <clipPath id="bar3"><rect x="529.5" y="77" width="66" height="6" rx="3" /></clipPath>
    <clipPath id="bar4"><rect x="754.5" y="77" width="66" height="6" rx="3" /></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="95" rx="16" fill="#0A1220" stroke="#1B2740" />

  <g stroke="#172336" stroke-width="1">
    <line x1="225" y1="26" x2="225" y2="70" /><line x1="450" y1="26" x2="450" y2="70" /><line x1="675" y1="26" x2="675" y2="70" />
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- 4 years -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,9;0,0" dur="0.5s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <g font-size="29" font-weight="700" fill="#58A6FF">
        <text x="112.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.15s" dur="0.13s" fill="remove" />1</text>
        <text x="112.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.28s" dur="0.13s" fill="remove" />2</text>
        <text x="112.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.41s" dur="0.13s" fill="remove" />3</text>
        <text x="112.5" y="48">4<set attributeName="opacity" to="0" begin="0.001s" dur="0.54s" fill="remove" /></text>
      </g>
      <text x="112.5" y="68" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#8FA1B8">YEARS IN PRODUCTION</text>
      <rect x="79.5" y="79" width="66" height="2" rx="1" fill="url(#b1)">
        <animate attributeName="width" values="0;66" dur="0.7s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
        <animate attributeName="x" values="112.5;79.5" dur="0.7s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      </rect>
      <g clip-path="url(#bar1)"><rect x="61.5" y="79" width="18" height="2" rx="1" fill="#EAF7FF" filter="url(#lum)" opacity="0.95"><animate attributeName="x" values="61.5;145.5" dur="2.4s" begin="1.2s" repeatCount="indefinite" /></rect></g>
    </g>

    <!-- 3 flagship products -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,9;0,0" dur="0.5s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <g font-size="29" font-weight="700" fill="#A08BFF">
        <text x="337.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.30s" dur="0.14s" fill="remove" />1</text>
        <text x="337.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.44s" dur="0.14s" fill="remove" />2</text>
        <text x="337.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.58s" dur="0.14s" fill="remove" />3</text>
        <text x="337.5" y="48">4+<set attributeName="opacity" to="0" begin="0.001s" dur="0.72s" fill="remove" /></text>
      </g>
      <text x="337.5" y="68" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#8FA1B8">FLAGSHIP PRODUCTS</text>
      <rect x="304.5" y="79" width="66" height="2" rx="1" fill="url(#b2)">
        <animate attributeName="width" values="0;66" dur="0.7s" begin="0.72s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
        <animate attributeName="x" values="337.5;304.5" dur="0.7s" begin="0.72s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      </rect>
      <g clip-path="url(#bar2)"><rect x="286.5" y="79" width="18" height="2" rx="1" fill="#EAF7FF" filter="url(#lum)" opacity="0.95"><animate attributeName="x" values="286.5;370.5" dur="2.4s" begin="1.5s" repeatCount="indefinite" /></rect></g>
    </g>

    <!-- 500+ live on stores -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,9;0,0" dur="0.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <g font-size="29" font-weight="700" fill="#4FE7C1">
        <text x="562.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.45s" dur="0.14s" fill="remove" />60</text>
        <text x="562.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.59s" dur="0.14s" fill="remove" />180</text>
        <text x="562.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.73s" dur="0.14s" fill="remove" />330</text>
        <text x="562.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.87s" dur="0.14s" fill="remove" />460</text>
        <text x="562.5" y="48">500+<set attributeName="opacity" to="0" begin="0.001s" dur="1.01s" fill="remove" /></text>
      </g>
      <text x="562.5" y="68" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#8FA1B8">LIVE ON STORES</text>
      <rect x="529.5" y="79" width="66" height="2" rx="1" fill="url(#b3)">
        <animate attributeName="width" values="0;66" dur="0.7s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
        <animate attributeName="x" values="562.5;529.5" dur="0.7s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      </rect>
      <g clip-path="url(#bar3)"><rect x="511.5" y="79" width="18" height="2" rx="1" fill="#EAF7FF" filter="url(#lum)" opacity="0.95"><animate attributeName="x" values="511.5;595.5" dur="2.4s" begin="1.8s" repeatCount="indefinite" /></rect></g>
    </g>

    <!-- 6 codebases -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0,9;0,0" dur="0.5s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      <g font-size="29" font-weight="700" fill="#FFCF5C">
        <text x="787.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.60s" dur="0.13s" fill="remove" />2</text>
        <text x="787.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.73s" dur="0.13s" fill="remove" />4</text>
        <text x="787.5" y="48" opacity="0"><set attributeName="opacity" to="1" begin="0.86s" dur="0.13s" fill="remove" />5</text>
        <text x="787.5" y="48">6<set attributeName="opacity" to="0" begin="0.001s" dur="0.99s" fill="remove" /></text>
      </g>
      <text x="787.5" y="68" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#8FA1B8">CODEBASES BEHIND THEM</text>
      <rect x="754.5" y="79" width="66" height="2" rx="1" fill="url(#b4)">
        <animate attributeName="width" values="0;66" dur="0.7s" begin="0.93s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
        <animate attributeName="x" values="787.5;754.5" dur="0.7s" begin="0.93s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
      </rect>
      <g clip-path="url(#bar4)"><rect x="736.5" y="79" width="18" height="2" rx="1" fill="#EAF7FF" filter="url(#lum)" opacity="0.95"><animate attributeName="x" values="736.5;820.5" dur="2.4s" begin="2.1s" repeatCount="indefinite" /></rect></g>
    </g>

  </g>
</svg>
