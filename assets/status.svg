<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 36" width="381" height="36" role="img" aria-label="Open to interesting problems in Flutter and native mobile">
  <title>Open to interesting problems in Flutter and native mobile</title>
  <rect x="0.5" y="0.5" width="380" height="35" rx="17.5" fill="#0E2018" stroke="#1E5B41" />

  <g transform="translate(22,18)">
    <circle r="9" fill="#2EA043" opacity="0">
      <animate attributeName="r" values="4;11" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1" />
      <animate attributeName="opacity" values="0.45;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="42" y="22" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8DDBA4">
    Open to interesting problems in Flutter and native mobile
  </text>
</svg>
